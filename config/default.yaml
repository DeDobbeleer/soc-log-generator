# SOC Log Generator - Default Configuration
# This file configures log generators for SOC/MSSP simulation

# Global configuration
global:
  timezone: "UTC"
  log_format: "ecs"  # ecs, cef, json
  
# Asset inventory (optional)
# If not specified, a default inventory is generated
inventory:
  domains:
    - corp.local
    - dmz.corp.local
    - admin.corp.local
  
  users:
    - username: jdoe
      domain: corp.local
      dept: IT
      role: admin
    - username: asmith
      domain: corp.local
      dept: HR
      role: user
    - username: mrobert
      domain: corp.local
      dept: Finance
      role: user

# Log generators
generators:
  # Windows Event Logs
  windows:
    enabled: true
    type: windows
    eps: 150              # Base events per second
    weight: 1.0           # Relative weight compared to other generators
    business_hours_mult: 2.0  # Business hours multiplier
    
    # Windows channels to generate
    channels:
      - Security
      - System
      - Application
      - Sysmon
      - PowerShell
    
    # Channel distribution (must sum to 100)
    channel_weights:
      - 50   # Security
      - 15   # System
      - 10   # Application
      - 20   # Sysmon
      - 5    # PowerShell

  # Linux Logs (syslog, auditd, auth)
  linux:
    enabled: true
    type: linux
    eps: 80
    weight: 0.8
    business_hours_mult: 1.5
    
    # Services to simulate
    services:
      - sshd
      - sudo
      - cron
      - auditd
      - kernel
    
    # Service distribution
    service_weights:
      - 40   # sshd
      - 25   # sudo
      - 10   # cron
      - 15   # auditd
      - 10   # kernel

  # Firewalls
  firewall:
    enabled: true
    type: firewall
    vendor: paloalto      # paloalto, fortinet, cisco_asa
    eps: 300
    weight: 1.5
    
    # Log types
    log_types:
      - TRAFFIC
      - THREAT
      - URL
      - DATA
    
    # Traffic vs threat distribution
    threat_ratio: 0.05    # 5% threat logs

  # Web Proxy (optional)
  proxy:
    enabled: false
    type: proxy
    vendor: bluecoat      # bluecoat, squid, zscaler
    eps: 100
    weight: 0.5

  # DNS Logs (optional)
  dns:
    enabled: false
    type: dns
    vendor: infoblox      # infoblox, bind, windows_dns
    eps: 500
    weight: 2.0

  # Cloud - AWS (optional)
  aws:
    enabled: false
    type: cloud
    service: cloudtrail
    eps: 50
    weight: 0.3

  # Cloud - Azure (optional)
  azure:
    enabled: false
    type: cloud
    service: sentinel
    eps: 40
    weight: 0.25

  # Office 365 (optional)
  o365:
    enabled: false
    type: cloud
    service: o365
    eps: 60
    weight: 0.4

  # EDR - CrowdStrike (optional)
  crowdstrike:
    enabled: false
    type: edr
    eps: 30
    weight: 0.2

  # EDR - Microsoft Defender (optional)
  defender:
    enabled: false
    type: edr
    eps: 25
    weight: 0.15

# Attack scenarios to inject
scenarios:
  enabled: true
  
  # List of available scenarios
  available:
    - brute_force_ssh
    - lateral_movement_smb
    - data_exfiltration_dns
    - ransomware_behavior
    - phishing_campaign
    - insider_threat
  
  # Scenario injection probability (per hour)
  injection_probability: 0.1
  
  # Scenario-specific configuration
  brute_force_ssh:
    duration: 300         # 5 minutes
    attempts: 50
    target_users:
      - root
      - admin
      - administrator
  
  lateral_movement:
    duration: 600
    techniques:
      - psexec
      - wmi_exec
      - scheduled_task

# Output configuration
outputs:
  # Local file output
  - type: file
    path: /var/log/soc-generator/logs.json
    rotation_size: 100MB
    format: json
  
  # Syslog TCP output
  - type: syslog
    host: 10.0.0.1
    port: 514
    protocol: tcp
    format: syslog        # syslog, json, cef
  
  # Syslog UDP output (optional)
  # - type: syslog
  #   host: 10.0.0.2
  #   port: 514
  #   protocol: udp
  #   format: json

# Performance parameters
performance:
  # Number of generation threads
  threads: 4
  
  # Event buffer size
  buffer_size: 10000
  
  # Batch mode for high throughput
  batch_mode: true
  batch_size: 100

# Monitoring and metrics
monitoring:
  # Display stats every N seconds
  stats_interval: 5
  
  # Enable Prometheus metrics
  prometheus_enabled: false
  prometheus_port: 9090
  
  # Health check endpoint
  health_check: false
  health_check_port: 8080
